<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>FishLog - เพิ่มประวัติปลา</title>

    <link
        rel="stylesheet"
        href="style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #101510;
            color: #edf3e5;
            font-family: Arial, "Segoe UI", sans-serif;
        }

        .page {
            max-width: 900px;
            margin: auto;
            padding: 25px;
        }

        /* HEADER */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;

            padding: 20px;

            margin-bottom: 20px;

            background: #1d251c;

            border: 1px solid #35422f;

            border-left: 4px solid #a6ff00;

            border-radius: 12px;
        }

        .header h1 {
            margin: 0;

            color: #a6ff00;

            font-size: 26px;

            letter-spacing: 2px;
        }

        .header p {
            margin: 5px 0 0;

            color: #9ca893;

            font-size: 13px;
        }

        .back-btn {
            padding: 10px 15px;

            background: #596b3f;

            color: white;

            text-decoration: none;

            border-radius: 7px;

            font-size: 13px;

            font-weight: bold;
        }

        .back-btn:hover {
            background: #778d52;
        }

        /* FORM */

        .form-card {
            background: #1d251c;

            border: 1px solid #35422f;

            border-radius: 12px;

            padding: 25px;
        }

        .section-title {
            margin-bottom: 18px;

            padding-bottom: 10px;

            border-bottom: 1px solid #35422f;

            color: #a6ff00;

            font-size: 15px;

            font-weight: bold;

            letter-spacing: 1px;
        }

        .grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;
        }

        .field {
            display: flex;

            flex-direction: column;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 7px;

            color: #d6ff8a;

            font-size: 12px;

            font-weight: bold;
        }

        input,
        textarea,
        select {

            width: 100%;

            padding: 12px;

            background: #111611;

            color: white;

            border: 1px solid #35422f;

            border-radius: 7px;

            outline: none;

            font-size: 14px;
        }

        input:focus,
        textarea:focus,
        select:focus {

            border-color: #a6ff00;

            box-shadow:
                0 0 0 2px
                rgba(166,255,0,0.08);
        }

        textarea {

            min-height: 110px;

            resize: vertical;
        }

        /* PHOTO */

        .photo-area {

            border: 1px dashed #596b3f;

            background: #111611;

            border-radius: 10px;

            padding: 20px;

            text-align: center;
        }

        .photo-icon {

            font-size: 42px;

            margin-bottom: 8px;
        }

        .photo-text {

            color: #9ca893;

            font-size: 12px;

            margin-bottom: 15px;
        }

        .photo-input {

            display: block;

            width: 100%;

            padding: 10px;

            background: #1d251c;

            border: 1px solid #35422f;

            border-radius: 7px;

            color: #edf3e5;
        }

        #photoPreview {

            display: none;

            width: 100%;

            max-height: 400px;

            object-fit: contain;

            margin-top: 18px;

            border-radius: 8px;

            border: 1px solid #596b3f;

            background: #101510;
        }

        /* BUTTON */

        .buttons {

            display: flex;

            gap: 12px;

            margin-top: 25px;
        }

        .save-btn {

            flex: 1;

            padding: 14px;

            background: #596b3f;

            color: white;

            border: 1px solid #778d52;

            border-radius: 7px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        .save-btn:hover {

            background: #778d52;
        }

        .cancel-btn {

            padding: 14px 22px;

            background: transparent;

            color: #9ca893;

            border: 1px solid #35422f;

            border-radius: 7px;

            text-decoration: none;

            font-size: 14px;
        }

        .cancel-btn:hover {

            color: white;

            border-color: #596b3f;
        }

        /* MOBILE */

        @media (max-width: 650px) {

            .page {
                padding: 15px;
            }

            .header {
                flex-direction: column;

                align-items: flex-start;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<div class="page">


    <!-- HEADER -->

    <div class="header">

        <div>

            <h1>
                ADD FISH
            </h1>

            <p>
                เพิ่มข้อมูลการตกปลา
            </p>

        </div>

        <a
            href="index.html"
            class="back-btn">

            ← DASHBOARD

        </a>

    </div>


    <!-- FORM -->

    <div class="form-card">


        <form
            id="fishForm"
            onsubmit="return saveFish(event)">


            <!-- BASIC INFO -->

            <div class="section-title">

                🐟 FISH INFORMATION

            </div>


            <div class="grid">


                <div class="field">

                    <label for="fishType">
                        ชนิดปลา *
                    </label>

                    <input
                        type="text"
                        id="fishType"
                        placeholder="เช่น ปลาช่อน"
                        required>

                </div>


                <div class="field">

                    <label for="weight">
                        น้ำหนัก (kg) *
                    </label>

                    <input
                        type="number"
                        id="weight"
                        step="0.01"
                        min="0"
                        placeholder="เช่น 2.50"
                        required>

                </div>


                <div class="field">

                    <label for="length">
                        ความยาว (cm)
                    </label>

                    <input
                        type="number"
                        id="length"
                        step="0.1"
                        min="0"
                        placeholder="เช่น 45">

                </div>


                <div class="field">

                    <label for="bait">
                        เหยื่อ
                    </label>

                    <input
                        type="text"
                        id="bait"
                        placeholder="เช่น กบยาง">

                </div>


            </div>


            <br>


            <!-- LOCATION -->

            <div class="section-title">

                📍 LOCATION & TIME

            </div>


            <div class="grid">


                <div class="field">

                    <label for="location">
                        สถานที่
                    </label>

                    <input
                        type="text"
                        id="location"
                        placeholder="เช่น บ่อ A">

                </div>


                <div class="field">

                    <label for="date">
                        วันที่
                    </label>

                    <input
                        type="date"
                        id="date">

                </div>


                <div class="field">

                    <label for="fishTime">
                        เวลา
                    </label>

                    <input
                        type="time"
                        id="fishTime">

                </div>


                <div class="field">

                    <label for="weather">
                        สภาพอากาศ
                    </label>

                    <select id="weather">

                        <option value="">
                            -- เลือก --
                        </option>

                        <option value="แดด">
                            ☀️ แดด
                        </option>

                        <option value="มีเมฆ">
                            ☁️ มีเมฆ
                        </option>

                        <option value="ฝน">
                            🌧️ ฝน
                        </option>

                        <option value="ลมแรง">
                            💨 ลมแรง
                        </option>

                    </select>

                </div>


                <div class="field">

                    <label for="waterCondition">
                        สภาพน้ำ
                    </label>

                    <select id="waterCondition">

                        <option value="">
                            -- เลือก --
                        </option>

                        <option value="ใส">
                            น้ำใส
                        </option>

                        <option value="ขุ่น">
                            น้ำขุ่น
                        </option>

                        <option value="ไหล">
                            น้ำไหล
                        </option>

                        <option value="นิ่ง">
                            น้ำนิ่ง
                        </option>

                    </select>

                </div>


            </div>


            <br>


            <!-- PHOTO -->

            <div class="section-title">

                📷 FISH PHOTO

            </div>


            <div class="photo-area">


                <div class="photo-icon">
                    📷
                </div>


                <div class="photo-text">

                    เลือกรูปปลาจากเครื่องของคุณ

                </div>


                <input
                    type="file"
                    id="photo"
                    class="photo-input"
                    accept="image/*">


                <img
                    id="photoPreview"
                    alt="ตัวอย่างรูปปลา">


            </div>


            <br>


            <!-- NOTE -->

            <div class="section-title">

                📝 NOTE

            </div>


            <div class="field">

                <label for="note">
                    รายละเอียดเพิ่มเติม
                </label>

                <textarea
                    id="note"
                    placeholder="บันทึกสิ่งที่น่าสนใจ เช่น เทคนิคที่ใช้ เวลาที่ปลาเข้ากิน หรือรายละเอียดอื่น ๆ"></textarea>

            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <a
                    href="history.html"
                    class="cancel-btn">

                    ยกเลิก

                </a>


                <button
                    type="submit"
                    class="save-btn">

                    🎣 บันทึกประวัติปลา

                </button>

            </div>


        </form>


    </div>


</div>


<!-- APP JS -->

<script src="app.js"></script>


<!-- PHOTO PREVIEW -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function() {


        var photoInput =
            document.getElementById("photo");


        var preview =
            document.getElementById("photoPreview");


        if (
            !photoInput ||
            !preview
        ) {

            return;

        }


        photoInput.addEventListener(
            "change",
            function() {


                var file =
                    photoInput.files[0];


                if (!file) {

                    preview.src = "";

                    preview.style.display =
                        "none";

                    return;

                }


                if (
                    !file.type.startsWith(
                        "image/"
                    )
                ) {

                    alert(
                        "กรุณาเลือกไฟล์รูปภาพ"
                    );

                    photoInput.value = "";

                    return;

                }


                var reader =
                    new FileReader();


                reader.onload =
                    function(event) {

                        preview.src =
                            event.target.result;

                        preview.style.display =
                            "block";

                    };


                reader.readAsDataURL(file);


            }
        );


        /* ตั้งวันที่เป็นวันนี้ */

        var dateInput =
            document.getElementById("date");


        if (
            dateInput &&
            !dateInput.value
        ) {

            var today =
                new Date();


            var year =
                today.getFullYear();


            var month =
                String(
                    today.getMonth() + 1
                ).padStart(
                    2,
                    "0"
                );


            var day =
                String(
                    today.getDate()
                ).padStart(
                    2,
                    "0"
                );


            dateInput.value =
                year +
                "-" +
                month +
                "-" +
                day;

        }

    }
);

</script>


</body>

</html>
